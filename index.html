            height: 100vh;
            display: flex;

            background: radial-gradient(circle, #252535, #0c0c12);
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .kula-btn {
            width: 280px;
            height: 280px;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
            
            /* Wygląd kuli 3D */
            background: radial-gradient(circle at 80px 80px, #ff416c, #ff4b2b, #880000);
            
            box-shadow: 
                0 30px 50px rgba(0, 0, 0, 0.7),
                inset -20px -20px 40px rgba(0, 0, 0, 0.8),
                inset 15px 15px 30px rgba(255, 255, 255, 0.5);
                
            transition: transform 0.05s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* Wciśnięcie kuli */
        .kula-btn:active {
            transform: scale(0.92) translateY(5px);
        }
    </style>

    <script>
        const przycisk = document.getElementById('button-kula');
        const dzwiek = document.getElementById('click-sound');

        // Podgłaśniamy maksymalnie w kodzie
        dzwiek.volume = 1.0;

        // Reakcja na dotyk (dla iPhone)
        przycisk.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Zapobiega podwójnemu klikaniu na telefonach
            odtworz();
        });

        // Reakcja na myszkę (dla komputerów)
        przycisk.addEventListener('mousedown', function(e) {
            odtworz();
        });

        function odtworz() {
            dzwiek.currentTime = 0;
            
            var playPromise = dzwiek.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Włącz dźwięk przyciskiem na obudowie iPhone'a!", error);
                });
            }
        }
    </script>
